<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Erreur')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<main class="container">
    <div class="panel panel-narrow text-center">
        <h1 th:text="${status} ?: 'Erreur'">Erreur</h1>
        <p th:text="${error} ?: 'Une erreur est survenue'">Une erreur est survenue</p>
        <p th:if="${message}" th:text="${message}" class="muted"></p>
        <a th:href="@{/}" class="btn btn-primary">Retour au tableau de bord</a>
    </div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
