<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Entrees/Sorties')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<main class="container">
    <h2>Entrees / Sorties</h2>
    <div th:replace="~{fragments/layout :: messages}"></div>

    <div class="two-cols">
        <div class="panel">
            <h3>Enregistrer une entree</h3>
            <form th:action="@{/operations/entries}" th:object="${entryRequest}" method="post">
                <div class="form-group">
                    <label>Immatriculation</label>
                    <input type="text" th:field="*{plateNumber}" placeholder="1234 TAA" required/>
                </div>
                <div class="form-group">
                    <label>Duree prevue (heures, optionnel)</label>
                    <input type="number" min="1" th:field="*{expectedDurationHours}"/>
                </div>
                <button type="submit" class="btn btn-primary">Faire entrer</button>
            </form>
        </div>

        <div class="panel">
            <h3>Enregistrer une sortie</h3>
            <form th:action="@{/operations/exits}" th:object="${exitRequest}" method="post">
                <div class="form-group">
                    <label>Immatriculation</label>
                    <input type="text" th:field="*{plateNumber}" placeholder="1234 TAA" required/>
                </div>
                <button type="submit" class="btn btn-primary">Faire sortir</button>
            </form>
        </div>
    </div>

    <div class="panel">
        <h3>Vehicules presents ( <span th:text="${#lists.size(activeSessions)}">0</span> )</h3>
        <table class="table">
            <thead>
            <tr>
                <th>Immatriculation</th>
                <th>Place</th>
                <th>Entree</th>
                <th>Duree prevue</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="s : ${activeSessions}">
                <td th:text="${s.plateNumber}">-</td>
                <td th:text="${s.spaceNumber}">-</td>
                <td th:text="${#temporals.format(s.entryTime, 'dd/MM/yyyy HH:mm')}">-</td>
                <td th:text="${s.expectedDurationHours != null ? s.expectedDurationHours + ' h' : '-'}">-</td>
            </tr>
            <tr th:if="${#lists.isEmpty(activeSessions)}">
                <td colspan="4" class="empty">Aucun vehicule present</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="panel">
        <h3>Historique des sessions</h3>
        <table class="table">
            <thead>
            <tr>
                <th>#</th>
                <th>Vehicule</th>
                <th>Place</th>
                <th>Entree</th>
                <th>Sortie</th>
                <th>Montant</th>
                <th>Statut</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="s : ${sessions.content}">
                <td th:text="${s.id}">-</td>
                <td th:text="${s.plateNumber}">-</td>
                <td th:text="${s.spaceNumber}">-</td>
                <td th:text="${#temporals.format(s.entryTime, 'dd/MM/yyyy HH:mm')}">-</td>
                <td th:text="${s.exitTime != null ? #temporals.format(s.exitTime, 'dd/MM/yyyy HH:mm') : '-'}">-</td>
                <td th:text="${s.amount != null ? #numbers.formatDecimal(s.amount, 1, 0) + ' Ar' : '-'}">-</td>
                <td><span class="badge" th:text="${s.status}">-</span></td>
            </tr>
            <tr th:if="${sessions.empty}">
                <td colspan="7" class="empty">Aucune session</td>
            </tr>
            </tbody>
        </table>

        <div class="pagination">
            <span th:text="'Page ' + (${sessions.number} + 1) + ' / ' + ${sessions.totalPages}"></span>
            <a th:if="${!sessions.first}" class="btn btn-small"
               th:href="@{/operations(page=${sessions.number - 1})}">Precedent</a>
            <a th:if="${!sessions.last}" class="btn btn-small"
               th:href="@{/operations(page=${sessions.number + 1})}">Suivant</a>
        </div>
    </div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
