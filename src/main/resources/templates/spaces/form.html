<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Place')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<main class="container">
    <h2 th:text="${editId} == null ? 'Nouvelle place' : 'Modifier la place'">Place</h2>

    <div class="panel panel-narrow">
        <form th:action="${editId} == null ? @{/spaces} : @{/spaces/{id}(id=${editId})}"
              th:object="${space}" method="post">
            <div class="form-group">
                <label>Numero</label>
                <input type="text" th:field="*{number}" required/>
                <span class="field-error" th:if="${#fields.hasErrors('number')}" th:errors="*{number}"></span>
            </div>
            <div class="form-group">
                <label>Zone</label>
                <input type="text" th:field="*{zone}" required/>
                <span class="field-error" th:if="${#fields.hasErrors('zone')}" th:errors="*{zone}"></span>
            </div>
            <div class="form-group">
                <label>Type</label>
                <select th:field="*{type}">
                    <option th:each="t : ${allTypes}" th:value="${t}" th:text="${t}"></option>
                </select>
            </div>
            <div class="form-group">
                <label>Statut</label>
                <select th:field="*{status}">
                    <option th:each="s : ${allStatus}" th:value="${s}" th:text="${s}"></option>
                </select>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Enregistrer</button>
                <a th:href="@{/spaces}" class="btn">Annuler</a>
            </div>
        </form>
    </div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
