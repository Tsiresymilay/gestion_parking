<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Abonnement')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<main class="container">
    <h2>Nouvel abonnement</h2>

    <div class="panel panel-narrow">
        <form th:action="@{/subscriptions}" th:object="${subscription}" method="post">
            <div class="form-group">
                <label>Client</label>
                <select th:field="*{userId}" required>
                    <option value="">-- Choisir --</option>
                    <option th:each="u : ${users}" th:value="${u.id}" th:text="${u.fullName}"></option>
                </select>
                <span class="field-error" th:if="${#fields.hasErrors('userId')}" th:errors="*{userId}"></span>
            </div>
            <div class="form-group">
                <label>Vehicule</label>
                <select th:field="*{vehicleId}" required>
                    <option value="">-- Choisir --</option>
                    <option th:each="v : ${vehicles}" th:value="${v.id}"
                            th:text="${v.plateNumber + ' - ' + v.brand}"></option>
                </select>
                <span class="field-error" th:if="${#fields.hasErrors('vehicleId')}" th:errors="*{vehicleId}"></span>
            </div>
            <div class="form-group">
                <label>Type d'abonnement</label>
                <select th:field="*{type}" required>
                    <option th:each="t : ${T(com.example.parking.entity.SubscriptionType).values()}"
                            th:value="${t}" th:text="${t}"></option>
                </select>
            </div>
            <div class="form-group">
                <label>Date de debut</label>
                <input type="date" th:field="*{startDate}" required/>
                <span class="field-error" th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}"></span>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Creer</button>
                <a th:href="@{/subscriptions}" class="btn">Annuler</a>
            </div>
        </form>
    </div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
