<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Reservation')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<main class="container">
    <h2>Nouvelle reservation</h2>

    <div class="panel panel-narrow">
        <form th:action="@{/reservations}" th:object="${reservation}" method="post">
            <div class="form-group">
                <label>Client</label>
                <select th:field="*{userId}" required>
                    <option value="">-- Choisir --</option>
                    <option th:each="u : ${users}" th:value="${u.id}"
                            th:text="${u.fullName + ' (' + u.userType + ')'}"></option>
                </select>
                <span class="field-error" th:if="${#fields.hasErrors('userId')}" th:errors="*{userId}"></span>
            </div>
            <div class="form-group">
                <label>Vehicule</label>
                <select th:field="*{vehicleId}" required>
                    <option value="">-- Choisir --</option>
                    <option th:each="v : ${vehicles}" th:value="${v.id}"
                            th:text="${v.plateNumber + ' - ' + v.brand}"></option>
                </select>
                <span class="field-error" th:if="${#fields.hasErrors('vehicleId')}" th:errors="*{vehicleId}"></span>
            </div>
            <div class="form-group">
                <label>Place (laisser vide pour attribution automatique)</label>
                <select th:field="*{spaceId}">
                    <option value="">-- Automatique --</option>
                    <option th:each="s : ${availableSpaces}" th:value="${s.id}"
                            th:text="${s.number + ' - ' + s.type + ' (' + s.zone + ')'}"></option>
                </select>
            </div>
            <div class="form-group">
                <label>Arrivee prevue</label>
                <input type="datetime-local" th:field="*{expectedArrival}" required/>
                <span class="field-error" th:if="${#fields.hasErrors('expectedArrival')}"
                      th:errors="*{expectedArrival}"></span>
            </div>
            <div class="form-group">
                <label>Depart prevu</label>
                <input type="datetime-local" th:field="*{expectedDeparture}" required/>
                <span class="field-error" th:if="${#fields.hasErrors('expectedDeparture')}"
                      th:errors="*{expectedDeparture}"></span>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Creer</button>
                <a th:href="@{/reservations}" class="btn">Annuler</a>
            </div>
        </form>
    </div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
