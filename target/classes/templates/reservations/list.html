<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Reservations')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<main class="container">
    <h2>Gestion des reservations</h2>
    <div th:replace="~{fragments/layout :: messages}"></div>

    <div class="panel">
        <form method="get" th:action="@{/reservations}" class="filters">
            <input type="text" name="keyword" placeholder="Rechercher par immatriculation"
                   th:value="${keyword}"/>
            <select name="status">
                <option value="">Tous les statuts</option>
                <option th:each="s : ${allStatus}" th:value="${s}"
                        th:text="${s}" th:selected="${statusFilter == s}"></option>
            </select>
            <button type="submit" class="btn">Filtrer</button>
            <a th:href="@{/reservations/new}" class="btn btn-primary">Nouvelle reservation</a>
        </form>

        <table class="table">
            <thead>
            <tr>
                <th>#</th>
                <th>Client</th>
                <th>Vehicule</th>
                <th>Place</th>
                <th>Arrivee prevue</th>
                <th>Depart prevu</th>
                <th>Statut</th>
                <th class="actions-col">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="r : ${reservations.content}">
                <td th:text="${r.id}">-</td>
                <td th:text="${r.userName}">-</td>
                <td th:text="${r.plateNumber}">-</td>
                <td th:text="${r.spaceNumber}">-</td>
                <td th:text="${#temporals.format(r.expectedArrival, 'dd/MM/yyyy HH:mm')}">-</td>
                <td th:text="${#temporals.format(r.expectedDeparture, 'dd/MM/yyyy HH:mm')}">-</td>
                <td><span class="badge" th:text="${r.status}">-</span></td>
                <td class="actions">
                    <form th:if="${r.status.name() == 'EN_ATTENTE'}"
                          th:action="@{/reservations/{id}/confirm(id=${r.id})}" method="post">
                        <button class="btn btn-small btn-primary" type="submit">Confirmer</button>
                    </form>
                    <form th:if="${r.status.name() != 'ANNULEE' and r.status.name() != 'TERMINEE'}"
                          th:action="@{/reservations/{id}/cancel(id=${r.id})}" method="post">
                        <button class="btn btn-small" type="submit">Annuler</button>
                    </form>
                    <form th:action="@{/reservations/{id}/delete(id=${r.id})}" method="post"
                          onsubmit="return confirm('Supprimer cette reservation ?');">
                        <button class="btn btn-small btn-danger" type="submit">Supprimer</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${reservations.empty}">
                <td colspan="8" class="empty">Aucune reservation</td>
            </tr>
            </tbody>
        </table>

        <div class="pagination">
            <span th:text="'Page ' + (${reservations.number} + 1) + ' / ' + ${reservations.totalPages}"></span>
            <a th:if="${!reservations.first}" class="btn btn-small"
               th:href="@{/reservations(page=${reservations.number - 1}, keyword=${keyword}, status=${statusFilter})}">Precedent</a>
            <a th:if="${!reservations.last}" class="btn btn-small"
               th:href="@{/reservations(page=${reservations.number + 1}, keyword=${keyword}, status=${statusFilter})}">Suivant</a>
        </div>
    </div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
