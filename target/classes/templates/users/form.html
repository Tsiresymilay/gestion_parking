<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Utilisateur')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<main class="container">
    <h2 th:text="${editId} == null ? 'Nouvel utilisateur' : 'Modifier l utilisateur'">Utilisateur</h2>

    <div class="panel panel-narrow">
        <form th:action="${editId} == null ? @{/users} : @{/users/{id}(id=${editId})}"
              th:object="${user}" method="post">
            <div class="form-group">
                <label>Nom d'utilisateur</label>
                <input type="text" th:field="*{username}" required/>
                <span class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
            </div>
            <div class="form-group">
                <label>Mot de passe (laisser vide pour ne pas changer)</label>
                <input type="password" th:field="*{password}"/>
                <span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
            </div>
            <div class="form-group">
                <label>Prenom</label>
                <input type="text" th:field="*{firstName}" required/>
                <span class="field-error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></span>
            </div>
            <div class="form-group">
                <label>Nom</label>
                <input type="text" th:field="*{lastName}" required/>
                <span class="field-error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></span>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" th:field="*{email}" required/>
                <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
            </div>
            <div class="form-group">
                <label>Telephone</label>
                <input type="text" th:field="*{phone}"/>
            </div>
            <div class="form-group">
                <label>Role</label>
                <select th:field="*{role}">
                    <option th:each="r : ${allRoles}" th:value="${r}" th:text="${r}"></option>
                </select>
            </div>
            <div class="form-group">
                <label>Type d'utilisateur</label>
                <select th:field="*{userType}">
                    <option th:each="t : ${allUserTypes}" th:value="${t}" th:text="${t}"></option>
                </select>
            </div>
            <div class="form-group form-check">
                <input type="checkbox" th:field="*{enabled}" id="enabled"/>
                <label for="enabled">Compte actif</label>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Enregistrer</button>
                <a th:href="@{/users}" class="btn">Annuler</a>
            </div>
        </form>
    </div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
