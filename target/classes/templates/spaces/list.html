<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Places')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<main class="container">
    <h2>Gestion des places</h2>
    <div th:replace="~{fragments/layout :: messages}"></div>

    <div class="panel">
        <form method="get" th:action="@{/spaces}" class="filters">
            <input type="text" name="keyword" placeholder="Rechercher (numero, zone)"
                   th:value="${keyword}"/>
            <select name="status">
                <option value="">Tous les statuts</option>
                <option th:each="s : ${allStatus}" th:value="${s}"
                        th:text="${s}" th:selected="${statusFilter == s}"></option>
            </select>
            <select name="type">
                <option value="">Tous les types</option>
                <option th:each="t : ${allTypes}" th:value="${t}"
                        th:text="${t}" th:selected="${typeFilter == t}"></option>
            </select>
            <button type="submit" class="btn">Filtrer</button>
            <a sec:authorize="hasAnyRole('ADMIN','MANAGER')" th:href="@{/spaces/new}" class="btn btn-primary">Nouvelle place</a>
        </form>

        <table class="table">
            <thead>
            <tr>
                <th>Numero</th>
                <th>Zone</th>
                <th>Type</th>
                <th>Statut</th>
                <th class="actions-col">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="s : ${spaces.content}">
                <td th:text="${s.number}">-</td>
                <td th:text="${s.zone}">-</td>
                <td><span class="badge" th:text="${s.type}">-</span></td>
                <td><span class="badge" th:classappend="${' st-' + s.status}" th:text="${s.status}">-</span></td>
                <td class="actions">
                    <a sec:authorize="hasAnyRole('ADMIN','MANAGER')"
                       th:href="@{/spaces/{id}/edit(id=${s.id})}" class="btn btn-small">Modifier</a>
                    <form sec:authorize="hasAnyRole('ADMIN','MANAGER')"
                          th:action="@{/spaces/{id}/delete(id=${s.id})}" method="post"
                          onsubmit="return confirm('Supprimer cette place ?');">
                        <button type="submit" class="btn btn-small btn-danger">Supprimer</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${spaces.empty}">
                <td colspan="5" class="empty">Aucune place trouvee</td>
            </tr>
            </tbody>
        </table>

        <div class="pagination">
            <span th:text="'Page ' + (${spaces.number} + 1) + ' / ' + ${spaces.totalPages}"></span>
            <a th:if="${!spaces.first}" class="btn btn-small"
               th:href="@{/spaces(page=${spaces.number - 1}, keyword=${keyword}, status=${statusFilter}, type=${typeFilter})}">Precedent</a>
            <a th:if="${!spaces.last}" class="btn btn-small"
               th:href="@{/spaces(page=${spaces.number + 1}, keyword=${keyword}, status=${statusFilter}, type=${typeFilter})}">Suivant</a>
        </div>
    </div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
